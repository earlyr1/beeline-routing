name: beeline-routing

services:
  frontend:
    build:
      context: frontend
    ports:
      - "8000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /app/data
      CACHE_PATH: /cache/cache.sqlite
      OSRM_URL: http://osrm:5000
      # День диспетчера живёт в Postgres: перезапуск backend его не теряет. Уберите переменную — сервис
      # вернётся к дню в памяти процесса, как было раньше. Пароль тут же в подстановке: база наружу
      # не торчит и живёт только внутри compose.
      DATABASE_URL: postgresql://${POSTGRES_USER:-routing}:${POSTGRES_PASSWORD:-routing}@postgres:5432/${POSTGRES_DB:-routing}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Матрицы общественного транспорта от 2ГИС лежат в репозитории (data/transit) и копируются в образ
      # вместе с бандлами и ночными планами, поэтому каталог сюда не монтируется: иначе у того, кто его у себя
      # удалил, пустой каталог с хоста заслонил бы копию из образа и сервис молча считал бы по формуле.
      # Пересчитали матрицы на хосте (backend/scripts/transit_matrix.py) — пересоберите образ:
      # docker compose up -d --build backend.
      - backend-cache:/cache
    expose:
      - "8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 24
    restart: unless-stopped

  # День диспетчера: планы, шкала событий и согласованные окна. Схему приводят в порядок миграции backend
  # (backend/migrations), они идут на его старте. Порт наружу не публикуется: смотреть — `make psql`.
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-routing}
      POSTGRES_USER: ${POSTGRES_USER:-routing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-routing}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-routing} -d ${POSTGRES_DB:-routing}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v26.9.0-debian
    command: ["osrm-routed", "--algorithm", "mld", "--max-table-size", "10000", "/data/moscow.osrm"]
    volumes:
      - osrm-data:/data
    ports:
      - "127.0.0.1:5050:5000"
    restart: unless-stopped

  osrm-prepare:
    profiles: ["prepare"]
    build:
      context: .
      dockerfile: infra/osrm/Dockerfile.prepare
    environment:
      OSRM_BBOX: ${OSRM_BBOX:-36.6,54.6,38.9,56.3}
    volumes:
      - osrm-data:/data

volumes:
  osrm-data:
  backend-cache:
  # День диспетчера. `docker compose down` его не трогает, `down -v` сносит вместе с kv-кэшем и графом OSRM.
  pg-data:
