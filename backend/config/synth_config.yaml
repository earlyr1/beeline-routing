# Правила досинтеза данных, которых нет в выгрузке Билайна. Любое изменение здесь
# меняет бандлы: перезапустите prepare и закоммитьте data/bundles.
#
# Калибровка (2026-09-15): реальное распределение диспетчеров в основном было выполнено,
# поэтому параметры подобраны так, чтобы план диспетчеров был почти допустим в нашей модели.
# Сетка «длительности x смены x старт x транспорт из истории» на трёх регионах дала лучший
# результат при длительностях x0.75 от первой оценки, одной смене 10:00-22:00 (график 2/2),
# старте из медоида истории бригады и автомобиле у бригад, которым он был нужен по истории.
seed: 20260817
event_time: "13:00"

regions:
  east:
    title: Восток
    control: data/raw/east_control.csv
    synthetic: data/raw/east_synthetic.csv
  south_east:
    title: Юго-восток
    control: data/raw/south_east_control.csv
    synthetic: data/raw/south_east_synthetic.csv
  south_center:
    title: Югоцентр
    control: data/raw/south_center_control.csv
    synthetic: data/raw/south_center_synthetic.csv
  # Сгенерированный регион: адреса OpenStreetMap, выдуманные бригады (config/regions/north_west.yaml)
  north_west:
    title: Северо-Запад
    control: data/raw/north_west_control.csv
    synthetic: data/raw/north_west_synthetic.csv

# Тип заявки BK -> навык из справочника ТЗ (п. 2.4.1)
skill_by_bk:
  Локальная заявка: local
  Подключение: connection
  Дозаказ: connection
  Глобальная проблема: emergency

# Время работ на адресе, минуты. Источник — официальные нормативы организаторов («Нормативы.xlsx»):
#
#   Название работы                    Дорога  Техработы  Документы  Базовый норматив  Планируем
#   Подключение клиентов Базовая         20        60         10            90             70
#   Аварий на ТКД                        20        80          0           100             80
#   Дозаказ оборудования                 20        10         10            40             20
#   Локальная заявка/ремонт у клиента    20        30          0            50             30
#
# ПЛАНИРУЕМ «Техработы + Документы», А НЕ «Базовый норматив». В базовый норматив уже зашиты
# 20 минут дороги до клиента, а дорогу сервис считает сам по матрице OSRM с пробочным профилем.
# Взять базовый норматив — посчитать дорогу дважды и раздуть день инженера. Не меняйте на базовый.
#
# Нормативы даны по типу работ, и эти четыре строки — ровно четыре типа заявки BK в выгрузке,
# поэтому таблица ключуется типом BK. Придуманную нами детализацию по типам HD мы сознательно
# теряем: например «Информация» стоила 15 минут, а теперь делит 80 минут своего типа BK
# «Глобальная проблема». Это цена следования официальному справочнику.
#
# Разброса нет: норматив — точное число, а не наша оценка, поэтому duration_jitter: 0.
# Неизвестный тип BK считаем по нормативу локальной заявки.
default_duration_min: 50
duration_jitter: 0
duration_round_to: 5
duration_by_bk:
  Подключение: 70
  Глобальная проблема: 80
  Дозаказ: 20
  Локальная заявка: 30

# Приоритет «Срочная»
urgent_bk_types: [Глобальная проблема]
urgent_control_statuses: [Просрочена]
cancelled_control_statuses: [Отменена]

# «Нужно привезти оборудование»: единица техники, которую инженер берёт с собой утром — роутер, приставка
# или колонка. Правило детерминированное: тип заявки HD из списка ниже или непустая колонка «Подключение»
# (FMC, FTTB — клиенту настраивают подключение, значит единицу везут). Флаг ничего не ограничивает
# в солвере, это информация инженеру: сколько единиц взять на день.
equipment_hd_types:
  - Дозаказ оборудования
  - Заказ подключения/Дозаказ оборудования
  - Заявка на подключение
  - Роутер. Замена техническим специалистом
  - TVE/ENT. Замена приставки техником
  - ТВ. Замена приставки техником

# Требуемый транспорт в заявке: первое сработавшее правило
transport_required_rules:
  - {skill: emergency, transport: car}
  - {hd_contains: Дозаказ оборудования, transport: car}

# Доли типов транспорта у инженеров; при 4+ инженерах каждый тип встречается хотя бы раз
transport_mix: {car: 0.55, public: 0.2, foot: 0.15, bike: 0.1}
force_car_for_skills: [emergency]
# Бригада, чьи реальные заявки требовали автомобиль по правилам выше, получает автомобиль
transport_from_history: true

# Стартовая точка: office или history_medoid (адрес из истории бригады, ближайший ко всем остальным).
# Бригады Каширы и Ступино в реальности не выезжают из московского офиса.
engineer_start: history_medoid

# Шаблоны смен: инженеру достаётся тот, что покрывает больше его исторических заявок
shifts:
  - {start: "10:00", end: "22:00"}

urgent_event:
  duration_min: 60
  window_min: 120
