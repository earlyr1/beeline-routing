[project]
name = "routing-backend"
version = "0.1.0"
description = "Планирование маршрутов выездных инженеров (кейс Билайн Бизнес)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "openai>=2.0,<3",
    "ortools>=9.15,<10",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic>=2.8",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "uvicorn[standard]>=0.30",
    "yoyo-migrations>=9.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
# db — тест идёт на настоящем Postgres; маркер ставит tests/conftest.py, отбирает его `make test-db`.
markers = ["db: прогон на настоящей базе (нужен TEST_DATABASE_URL)"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # длинные русские строки сообщений; код форматирует ruff format
