[project]
name = "routing-backend"
version = "0.1.0"
description = "Планирование маршрутов выездных инженеров (кейс Билайн Бизнес)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "openai>=2.0,<3",
    "ortools>=9.15,<10",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic>=2.8",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "uvicorn[standard]>=0.30",
    "yoyo-migrations>=9.0.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=8.3",
    "pytest-cov>=7.1.0",
    # Та же версия — rev хука ruff в .pre-commit-config.yaml: менять вместе, иначе хук и make lint разойдутся в стиле.
    "ruff==0.16.7",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
# db — тест идёт на настоящем Postgres; маркер ставит tests/conftest.py, отбирает его `make test-db`.
markers = ["db: прогон на настоящей базе (нужен TEST_DATABASE_URL)"]

# Покрытие меряет CI (.github/workflows/ci.yml): прогон без базы и прогон на Postgres пишут каждый свои данные,
# job coverage их складывает и падает, если процент ниже порога. Локально: `make test PYTEST_ARGS=--cov` —
# без половин [postgres], поэтому процент там ниже, чем в CI.
[tool.coverage.run]
source = ["app"]
# Пути в данных — от каталога backend: данные двух job складываются, где бы ни лежал checkout.
relative_files = true
# Поиск OR-Tools идёт и в процессах пула (app/solvers/portfolio.py, spawn): без multiprocessing их строки
# считались бы непокрытыми. Каждый процесс пишет свой файл данных, прогон pytest-cov их потом объединяет.
concurrency = ["thread", "multiprocessing"]

[tool.coverage.report]
# Порог FAIL_UNDER job coverage сравнивается с процентом, округлённым до стольких знаков: с нулём знаков порог 94
# пропускал бы и 93,5%. С двумя пропускает от 93,995% — бейдж, округляющий вниз до десятых, покажет там 93.9%,
# но это разница меньше сотой процента.
precision = 2

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # длинные русские строки сообщений; код форматирует ruff format

[tool.mypy]
python_version = "3.12"
files = ["app", "scripts", "tests"]
# Конструкторы моделей pydantic принимают то, что модель сама приводит к типу поля («13:00» в минуты и т. п.):
# типы аргументов конструктора mypy не проверяет (init_typed = false у плагина), только имена полей — ниже.
plugins = ["pydantic.mypy"]
# scripts без __init__.py: модули называются по пути от backend (scripts.night_plan), как их импортируют тесты.
explicit_package_bases = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true

# Лишний или опечатанный аргумент конструктора модели — ошибка mypy: в рантайме pydantic (extra="ignore") его молча выбросит.
[tool.pydantic-mypy]
init_forbid_extra = true
warn_required_dynamic_aliases = true

# Библиотеки без аннотаций типов (ни py.typed, ни пакета types-*).
[[tool.mypy.overrides]]
module = ["ortools.*", "yoyo.*"]
ignore_missing_imports = true

# Тесты обращаются к полям Optional без проверки на None: если там None, тест и так падает на AttributeError.
[[tool.mypy.overrides]]
module = ["tests.*"]
disable_error_code = ["union-attr"]
