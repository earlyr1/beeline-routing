# Стиль backend отдельным workflow — ради своего бейджа в README: у ci.yml бейдж один на всё. Тот же make lint
# идёт и в ci.yml (job backend), и выкат на сервер жюри ждёт именно его; этот workflow ничего не выкатывает.
name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ruff:
    name: ruff check и ruff format --check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Та же версия uv, что в ci.yml и backend/Dockerfile.
      - run: python -m pip install uv==0.12.13
      # Кэш пакетов uv по uv.lock: make lint ставит всё окружение backend, и пакеты не качаются каждый раз заново.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-py3.12-${{ hashFiles('backend/uv.lock') }}
          restore-keys: uv-${{ runner.os }}-py3.12-
      - name: make lint
        run: make lint
