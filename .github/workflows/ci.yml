# Тесты на каждый пуш в main и на pull request; после зелёных тестов пуш в main собирает образы и выкатывает их
# на сервер жюри. Выкат вручную — Actions → ci → Run workflow на ветке main. Откат — Re-run all jobs у прогона
# нужного коммита: он соберёт те же образы из кэша и выкатит их. Пуш, который к концу тестов уже не верхушка
# main, не выкатывается (job tip): иначе поздно дотестированный старый коммит откатил бы сервер назад.
#
# Покрытие и число тестов для бейджей README меряются здесь же, в прогонах тестов: job coverage складывает
# покрытие двух прогонов backend и держит порог, job badges рисует SVG и кладёт их в ветку badges — на каждом
# пуше в main, и на красном тоже.
#
# Настройки репозитория (кладёт infra/github/set_secrets.py):
#   переменные — YC_SA_ID (сервисный аккаунт routing-ci), YC_REGISTRY_ID, VM_HOST (публичный IP),
#   SITE_HOST (имя в nip.io для ключа Яндекс Карт), TLS_MODE;
#   секреты — VM_SSH_KEY, VM_KNOWN_HOSTS, POSTGRES_PASSWORD, BASIC_AUTH_USER, BASIC_AUTH_HASH, BASIC_AUTH_PASSWORD
#   и ключи приложения YANDEX_MAPS_API_KEY, YANDEX_GEOCODER_API_KEY, LLM_BASE_URL, LLM_API_KEY, LLM_MODEL.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: backend — ruff, mypy и pytest без базы
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          # requires-python в backend/pyproject.toml: >=3.12,<3.13
          python-version: "3.12"
      # Та же версия uv, что в backend/Dockerfile.
      - run: python -m pip install uv==0.12.13
      - name: make lint
        run: make lint
      - name: make typecheck
        run: make typecheck
      # С покрытием и отчётом JUnit: их забирают job coverage и badges.
      - name: make test
        env:
          COVERAGE_FILE: ${{ github.workspace }}/reports/backend.coverage
        run: make test PYTEST_ARGS="--cov --cov-report= --junitxml=$GITHUB_WORKSPACE/reports/junit-backend.xml"
      # Рядом с backend.coverage могут лежать файлы процессов пула OR-Tools, дописанные уже после pytest:
      # job coverage сложит и их. Отчёты грузятся и после упавшего теста — по ним бейдж tests покажет, сколько
      # упало; если job упал раньше pytest (ruff, mypy), отчётов нет, и бейдж скажет об этом сам.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: reports-backend
          path: reports/
          if-no-files-found: warn
          retention-days: 7
          # Re-run (им же делается откат) грузит отчёты заново под тем же именем.
          overwrite: true

  backend-db:
    name: backend — тесты на Postgres (маркер db)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # То же, что make test-db, только базу поднимает сам Actions, а не docker run из Makefile.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: routing
          POSTGRES_USER: routing
          POSTGRES_PASSWORD: routing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U routing -d routing"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://routing:routing@localhost:5432/routing
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.12.13
      - name: pytest -m db
        working-directory: backend
        env:
          COVERAGE_FILE: ${{ github.workspace }}/reports/backend-db.coverage
        run: uv run pytest -o addopts= -q -m db --cov --cov-report= --junitxml=../reports/junit-backend-db.xml
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: reports-backend-db
          path: reports/
          if-no-files-found: warn
          retention-days: 7
          overwrite: true

  frontend:
    name: frontend — tsc, vitest, сборка
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    # Итог самого vitest для бейджей tests и покрытия фронта: они краснеют от упавшего теста или порога,
    # а не от сборки после них.
    outputs:
      vitest: ${{ steps.vitest.outcome }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          # Как в frontend/Dockerfile (node:22-alpine).
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      # Порог покрытия — thresholds в vite.config.ts: ниже него vitest падает, как на упавшем тесте.
      - name: vitest с покрытием
        id: vitest
        run: >-
          npx vitest run --coverage --coverage.reportsDirectory=../reports/coverage-frontend
          --reporter=default --reporter=junit --outputFile.junit=../reports/junit-frontend.xml
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: reports-frontend
          path: |
            reports/junit-frontend.xml
            reports/coverage-frontend/coverage-summary.json
          if-no-files-found: warn
          retention-days: 7
          overwrite: true

  # Покрытие backend: прогон без базы не проходит код хранилища на Postgres, прогон с базой — всё остальное,
  # поэтому честный процент есть только у суммы двух. Порог — чуть ниже измеренного (24.09.2026: 95,5% строк,
  # без базы 92,3%): заметное падение покрытия краснит CI и бейдж и не пускает выкат. Выросло — порог можно
  # поднять.
  coverage:
    name: backend — покрытие двух прогонов вместе
    needs: [backend, backend-db]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      FAIL_UNDER: "94"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.12.13
      - uses: actions/download-artifact@v4
        with:
          pattern: reports-backend*
          path: reports
          merge-multiple: true
      # Для отчёта нужен только coverage: без --only-dev uv ставил бы и OR-Tools со всем backend.
      - name: coverage combine
        run: uv run --frozen --only-dev coverage combine ../reports/*.coverage*
      # Отчёт для бейджа — до проверки порога: процент ниже порога бейдж тоже покажет, только красным.
      - run: uv run --frozen --only-dev coverage json -o ../reports/coverage-backend.json
      - name: coverage report
        run: uv run --frozen --only-dev coverage report --sort=cover --fail-under="$FAIL_UNDER"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: reports-coverage
          path: reports/coverage-backend.json
          if-no-files-found: warn
          retention-days: 7
          overwrite: true

  # Бейджи README: число тестов и покрытие backend и frontend. Репозиторий закрытый, shields.io до его прогонов
  # не дотянуться, поэтому SVG рисует backend/scripts/badges.py, а README берёт их из ветки badges — отдельной
  # истории без кода. Рисуются на каждом пуше в main, чем бы ни кончились тесты, если коммит всё ещё верхушка
  # main: бейджи всегда про последний main, а не про последний зелёный. Упал тест — tests красный и говорит,
  # сколько упало; покрытие упавшего шага — красное; отчёта нет (job упал раньше тестов, покрытие не считалось) —
  # серый unknown. Отменённый прогон бейджи не трогает.
  badges:
    name: бейджи README в ветку badges
    needs: [backend, backend-db, frontend, coverage]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Право на запись — только здесь, и пишет job только в ветку badges.
    permissions:
      contents: write
    # Ветку badges правит один прогон за раз: два пуша не толкаются, и push всегда fast-forward.
    concurrency:
      group: badges
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Каких отчётов нет, те бейджи выйдут серыми: сбой скачивания не должен оставить в ветке старые числа.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: reports-*
          path: reports
          merge-multiple: true
      - name: SVG
        env:
          BACKEND: ${{ needs.backend.result }}
          BACKEND_DB: ${{ needs.backend-db.result }}
          COVERAGE: ${{ needs.coverage.result }}
          # Итог самого vitest; не отдал GitHub выход упавшего job — итог всего frontend (бейджи фронта тогда
          # красные и при упавшей сборке).
          VITEST: ${{ needs.frontend.outputs.vitest || needs.frontend.result }}
        run: >-
          python3 backend/scripts/badges.py badges
          --backend-coverage reports/coverage-backend.json
          --frontend-coverage reports/coverage-frontend/coverage-summary.json
          --junit backend=reports/junit-backend.xml backend-db=reports/junit-backend-db.xml
          frontend=reports/junit-frontend.xml
          --status "backend=$BACKEND" "backend-db=$BACKEND_DB" "frontend=$VITEST"
          "backend-coverage=$COVERAGE" "frontend-coverage=$VITEST"
      - name: В ветку badges
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -q -b badges "$RUNNER_TEMP/badges"
          cd "$RUNNER_TEMP/badges"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Токен — в заголовке, как его кладёт actions/checkout: в адресе remote он попадал бы в вывод git.
          basic=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$basic"
          git config http.https://github.com/.extraheader "AUTHORIZATION: basic $basic"
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          # Пока шли тесты, в main мог прийти новый пуш: его прогон и нарисует бейджи, старые числа не нужны.
          main_sha=$(git ls-remote origin refs/heads/main | cut -f1)
          if [[ $main_sha != "$GITHUB_SHA" ]]; then
            echo "::notice::В main уже $main_sha: бейджи нарисует его прогон"
            exit 0
          fi
          # Ветки badges ещё нет (exit 2) — первый коммит станет её началом.
          status=0
          git ls-remote --exit-code --heads origin badges >/dev/null || status=$?
          if ((status == 0)); then
            git fetch -q --depth 1 origin badges
            git reset -q --hard FETCH_HEAD
          elif ((status != 2)); then
            exit "$status"
          fi
          cp "$GITHUB_WORKSPACE"/badges/*.svg .
          git add -A
          if git diff --cached --quiet; then
            echo "Бейджи не изменились"
            exit 0
          fi
          git commit -q -m "Бейджи по коммиту ${GITHUB_SHA::7}"
          git push -q origin HEAD:refs/heads/badges

  # Выкатывается только верхушка main. Тесты двух близких пушей могут закончиться в обратном порядке, и тогда
  # выкат старого коммита встал бы в очередь за новым и откатил бы сервер. Ручной запуск и Re-run (откат на
  # старый коммит нарочно) проходят всегда. Проверка после тестов: к этому времени более новый пуш уже виден.
  tip:
    name: коммит всё ещё верхушка main
    needs: [backend, backend-db, frontend, coverage]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      deploy: ${{ steps.tip.outputs.deploy }}
    steps:
      - id: tip
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          if [[ $EVENT != push || $ATTEMPT != 1 ]]; then
            echo "deploy=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [[ $main_sha == "$GITHUB_SHA" ]]; then
            echo "deploy=true" >>"$GITHUB_OUTPUT"
          else
            echo "::notice::В main уже $main_sha: $GITHUB_SHA не выкатывается. Нужен именно он — Re-run all jobs"
            echo "deploy=false" >>"$GITHUB_OUTPUT"
          fi

  deploy:
    name: образы и выкат на сервер жюри
    needs: tip
    if: needs.tip.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Никакого environment: у этого job — с ним sub в OIDC-токене станет repo:…:environment:…, а федерация
    # в Yandex Cloud доверяет только repo:earlyr1/beeline-routing:ref:refs/heads/main.
    permissions:
      id-token: write
      contents: read
    # Одна правка сервера за раз: выкаты и сборка графа OSRM (osrm-graph.yml) встают в общую очередь. Ждать в ней
    # GitHub даёт только одному прогону: новый отменяет ожидающий, и отменённый выкат или граф запускают заново.
    concurrency:
      group: jury-vm
      cancel-in-progress: false
    env:
      REGISTRY: cr.yandex/${{ vars.YC_REGISTRY_ID }}
      TAG: ${{ github.sha }}
      VM_HOST: ${{ vars.VM_HOST }}
    steps:
      - name: Настройки репозитория на месте
        env:
          YC_SA_ID: ${{ vars.YC_SA_ID }}
          YC_REGISTRY_ID: ${{ vars.YC_REGISTRY_ID }}
        run: |
          missing=()
          for name in YC_SA_ID YC_REGISTRY_ID VM_HOST; do
            [[ -n ${!name} ]] || missing+=("$name")
          done
          if ((${#missing[@]})); then
            echo "::error::Не заданы переменные репозитория: ${missing[*]}. Их кладёт infra/github/set_secrets.py"
            exit 1
          fi

      # Git после checkout не нужен: токен прогона не остаётся в .git/config на всё время job.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Без долгоживущих ключей: GitHub выдаёт прогону OIDC-токен, Yandex Cloud меняет его на IAM-токен routing-ci.
      - name: Вход в Container Registry
        uses: yc-actions/yc-cr-login@v3
        with:
          yc-sa-id: ${{ vars.YC_SA_ID }}

      - uses: docker/setup-buildx-action@v3

      - name: Образ backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          provenance: false
          tags: |
            ${{ env.REGISTRY }}/backend:${{ env.TAG }}
            ${{ env.REGISTRY }}/backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Образ frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          provenance: false
          tags: |
            ${{ env.REGISTRY }}/frontend:${{ env.TAG }}
            ${{ env.REGISTRY }}/frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      - name: SSH до машины
        uses: ./.github/actions/vm-ssh
        with:
          host: ${{ vars.VM_HOST }}
          ssh-key: ${{ secrets.VM_SSH_KEY }}
          known-hosts: ${{ secrets.VM_KNOWN_HOSTS }}

      - name: Файлы compose, Caddyfile и .env на машину
        env:
          VM_HOST: ${{ vars.VM_HOST }}
          SITE_HOST: ${{ vars.SITE_HOST }}
          TLS_MODE: ${{ vars.TLS_MODE || 'acme' }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          BASIC_AUTH_USER: ${{ secrets.BASIC_AUTH_USER }}
          BASIC_AUTH_HASH: ${{ secrets.BASIC_AUTH_HASH }}
          YANDEX_MAPS_API_KEY: ${{ secrets.YANDEX_MAPS_API_KEY }}
          YANDEX_GEOCODER_API_KEY: ${{ secrets.YANDEX_GEOCODER_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          for name in POSTGRES_PASSWORD BASIC_AUTH_USER BASIC_AUTH_HASH; do
            if [[ -z ${!name} ]]; then
              echo "::error::Не задан секрет $name"
              exit 1
            fi
          done
          if [[ $TLS_MODE != acme && $TLS_MODE != internal ]]; then
            echo "::error::TLS_MODE — acme или internal, а не $TLS_MODE"
            exit 1
          fi
          # Сайт — имя в nip.io (его разрешает ключ Яндекс Карт) и голый IP; без SITE_HOST — только IP.
          # shellcheck disable=SC2034  # читается ниже через ${!name} в env_line
          SITE_ADDRESS="${SITE_HOST:+$SITE_HOST, }$VM_HOST"
          # shellcheck disable=SC2034
          DEFAULT_SNI=$VM_HOST
          # Хэш Caddyfile — метка контейнера caddy в docker-compose.prod.yml: правка файла пересоздаёт Caddy.
          # shellcheck disable=SC2034  # читается ниже через ${!name} в env_line
          CADDYFILE_SHA=$(sha256sum infra/caddy/Caddyfile | cut -c1-64)
          # Пути в ~/app те же, что в репозитории: docker-compose.prod.yml монтирует каталог ./infra/caddy.
          tar -cf - docker-compose.yml docker-compose.prod.yml infra/caddy/Caddyfile |
            ssh vm 'mkdir -p ~/app && tar -xf - -C ~/app'
          # .env собирается в памяти раннера и уходит через stdin ssh: значений нет ни в командной строке, ни в
          # файлах раннера. Каждое значение в одинарных кавычках — так compose не трогает $ внутри (хэш bcrypt
          # из них и состоит). Одинарную кавычку и перевод строки в таком виде не записать, их не пускаем.
          env_line() {
            local name=$1 value=${!1}
            case $value in
              *"'"* | *$'\n'*)
                echo "::error::В значении $name одинарная кавычка или перевод строки: в .env так не записать" >&2
                return 1
                ;;
            esac
            printf "%s='%s'\n" "$name" "$value"
          }
          env_file=$(
            for name in REGISTRY TAG SITE_ADDRESS DEFAULT_SNI TLS_MODE CADDYFILE_SHA POSTGRES_PASSWORD BASIC_AUTH_USER \
              BASIC_AUTH_HASH YANDEX_MAPS_API_KEY YANDEX_GEOCODER_API_KEY LLM_BASE_URL LLM_API_KEY LLM_MODEL; do
              env_line "$name" || exit 1
            done
          )
          printf '%s\n' "$env_file" | ssh vm 'umask 077 && cat > ~/app/.env.new && mv ~/app/.env.new ~/app/.env'

      - name: Выкат
        run: |
          ssh vm 'bash -s' <<'EOF'
          set -euo pipefail
          cd ~/app
          compose() { docker compose -f docker-compose.yml -f docker-compose.prod.yml "$@"; }
          # Реестр пускает машину по IAM-токену её сервисного аккаунта routing-vm из метаданных. Токен живёт
          # меньше 12 часов, поэтому логин прямо перед pull, а на выходе из скрипта — logout.
          curl -sf -H Metadata-Flavor:Google \
            http://169.254.169.254/computeMetadata/v1/instance/service-accounts/default/token |
            jq -r .access_token | docker login --username iam --password-stdin cr.yandex
          trap 'docker logout cr.yandex >/dev/null' EXIT
          compose pull --quiet
          # up ждёт здоровья backend (миграции, загрузка данных): если не дождался, в лог job — хвост его лога.
          if ! compose up -d --no-build --remove-orphans; then
            compose ps
            compose logs --tail 80 backend postgres
            exit 1
          fi
          compose ps
          EOF

      # Проверка идёт на самой машине, но тем же путём, что у жюри: Caddy, TLS, пароль, nginx, backend.
      # Пароль уходит в curl на машине через stdin (--config -): его нет ни в командной строке, ни в файлах.
      - name: Сервис отвечает через Caddy
        env:
          BASIC_AUTH_USER: ${{ secrets.BASIC_AUTH_USER }}
          BASIC_AUTH_PASSWORD: ${{ secrets.BASIC_AUTH_PASSWORD }}
        run: |
          if [[ -z $BASIC_AUTH_PASSWORD ]]; then
            echo "::error::Не задан секрет BASIC_AUTH_PASSWORD"
            exit 1
          fi
          # В конфиге curl строка в кавычках: \ и " внутри экранируются.
          user=${BASIC_AUTH_USER//\\/\\\\}
          user=${user//\"/\\\"}
          password=${BASIC_AUTH_PASSWORD//\\/\\\\}
          password=${password//\"/\\\"}
          check="curl -fsS -k --max-time 10 --resolve $VM_HOST:443:127.0.0.1 --config - https://$VM_HOST/api/health"
          # До 5 минут: на первом выкате Caddy ещё получает сертификат, backend применяет миграции.
          for attempt in $(seq 1 60); do
            # shellcheck disable=SC2029  # $check нарочно раскрывается здесь: в нём только IP, без секретов
            if printf 'user = "%s:%s"\n' "$user" "$password" | ssh vm "$check"; then
              echo
              echo "Сервис отвечает, попытка $attempt"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Сервис не ответил за 5 минут"
          ssh vm 'cd ~/app && c="docker compose -f docker-compose.yml -f docker-compose.prod.yml" &&
            $c ps && $c logs --tail 60 caddy frontend backend'
          exit 1

      # Старые образы на диске не нужны: откат всё равно скачает свой тег из реестра заново.
      - name: Уборка старых образов
        run: ssh vm 'docker image prune -af >/dev/null && df -h / | tail -1'

      # Ключ deploy — по сути root на машине. Обычные шаги идут раньше завершающих (post) шагов сторонних
      # actions, так что к их запуску ключа на раннере уже нет.
      - name: Ключ SSH с раннера
        if: always()
        run: rm -f ~/.ssh/deploy_key ~/.ssh/config ~/.ssh/known_hosts_vm
